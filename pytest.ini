[pytest]
# Repo layout (2026-08): tests live under tests/
testpaths = tests
pythonpath = .

# Standalone GUI script suites (not pytest cases): open real windows and sys.exit.
# Run them manually with the project venv:
#   venv\Scripts\python tests\test_hittest.py
#   venv\Scripts\python tests\test_resize_freedom.py
#   venv\Scripts\python tests\test_wordclick.py
addopts =
    --ignore=tests/test_hittest.py
    --ignore=tests/test_resize_freedom.py
    --ignore=tests/test_wordclick.py
