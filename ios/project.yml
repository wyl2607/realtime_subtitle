name: RSiOS
options:
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.40.0"
  xcodeVersion: "27.0"
  swiftVersion: "5.0"
  generateSharedSchemes: true
  bundleIdPrefix: com.wyl2607
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
  groups:
    - RSiOS
    - RSBroadcast
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    OTHER_SWIFT_FLAGS: -D DEBUG
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      MTL_FAST_MATH: "YES"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      GCC_OPTIMIZATION_LEVEL: "s"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      MTL_FAST_MATH: "YES"
targets:
  RSiOS:
    type: application
    platform: iOS
    sources:
      - path: RSiOS
      - path: Shared
        excludes:
          - "**/Resources/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinwang.realtimesubtitle
        INFOPLIST_FILE: RSiOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: RSiOS/RSiOS.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: RSBroadcast
        embed: true
    scheme:
      testTargets: []
  RSBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: RSBroadcast
      - path: Shared
        excludes:
          - "**/Resources/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinwang.realtimesubtitle.broadcast
        INFOPLIST_FILE: RSBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: RSBroadcast/RSBroadcast.entitlements
        NSEXTENSION_POINT_IDENTIFIER: com.apple.broadcast-services-upload
        NSEXTENSION_PRINCIPAL_CLASS: $(PRODUCT_MODULE_NAME).SampleHandler
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
        ENABLE_BITCODE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []