name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pipeline-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # test_pipeline_helpers only needs numpy + stdlib helpers;
          # translator_queue lazy-loads torch/faster-whisper on construct
          # pytest comes from requirements-dev.txt so its version lives in one place
          pip install "numpy>=1.24,<3" "requests>=2.28,<3" -r requirements-dev.txt
      - name: Run non-GUI unit tests
        run: python -m pytest test_pipeline_helpers.py -q
