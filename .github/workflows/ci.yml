name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Non-GUI unit tests only need numpy + requests + pytest.
          # translator_queue lazy-loads torch/faster-whisper on construct.
          pip install "numpy>=1.24,<3" "requests>=2.28,<3" -r requirements-dev.txt
      - name: Run non-GUI unit tests
        run: python -m pytest tests/test_pipeline_helpers.py -q
