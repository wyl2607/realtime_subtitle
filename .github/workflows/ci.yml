name: CI

# 临时诊断分支（不合并）：#80 在 Swift 6.3.3 上 release 编译 rslite 时 swift-frontend
# 卡死 6 小时。本地只有 Swift 6.4 复现不了，这里在 CI 上定位卡在哪个阶段/哪个文件。
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release-wmo, release-nowmo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: swift --version
      - name: build with watchdog
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            debug)         args=(-c debug) ;;
            release-wmo)   args=(-c release) ;;
            release-nowmo) args=(-c release -Xswiftc -no-whole-module-optimization -j 1) ;;
          esac
          start=$(date +%s)
          swift build --package-path macos-native --target rslite -v "${args[@]}" > build.log 2>&1 &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            sleep 20
            if (( $(date +%s) - start > 900 )); then
              echo "::error::still building after 15 min — sampling"
              pgrep -lf swift-frontend | cut -c1-400 || true
              for p in $(pgrep swift-frontend); do
                # 主文件（-primary-file）告诉我们卡在哪个源文件；sample 栈告诉我们卡在哪个编译阶段
                ps -o args= -p $p | tr ' ' '\n' | grep -A1 -- '-primary-file' || true
                sample $p 5 -file sample-$p.txt >/dev/null 2>&1 || true
                sed -n '/Call graph:/,/Total number in stack/p' sample-$p.txt | grep -E 'swift::|llvm::' | head -150 | cut -c1-260
                sed -n '/Sort by top of stack/,$p' sample-$p.txt | head -30 | cut -c1-260
              done
              pkill -9 swift-frontend || true
              kill $pid 2>/dev/null || true
              tail -40 build.log | cut -c1-400
              exit 1
            fi
          done
          wait $pid; rc=$?
          echo "elapsed $(( $(date +%s) - start ))s rc=$rc"
          grep -E 'error:' build.log | head -40 || true
          tail -5 build.log | cut -c1-400
          exit $rc
