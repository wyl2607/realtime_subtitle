name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 默认的 GITHUB_TOKEN 权限跟着仓库设置走，可能是可写的。这两个 job 只需要
# 读代码，显式收到最小权限（供应链硬化的标准做法，不改变任何现有行为）
permissions:
  contents: read

# Coverage map (see issue #23):
# - lint:          ruff（E9 + F，规则集为什么这么窄见 ruff.toml）
# - deps-resolve:  requirements.txt 在 3.10–3.13 上都解得出来（见第 4 节第 30 条）
# - ubuntu:        pure pipeline helpers (no torch/PyQt/WASAPI)
# - windows:       full pytest suite except standalone GUI harness scripts
#   (those open real windows and sys.exit; still manual / optional)

jobs:
  # 静态检查单独一个 job：十几秒出结果，不用等 windows 那边装完 torch 才知道
  # 有没有把某个名字打错。它盯的是 CLAUDE.md 第 4 节第 26/28 条那一类
  # "挪模块时的漏改"——那次包化重构漏了 30 多处函数体里的延迟 import，
  # master 的 CI 连红 6 次，而 F821/F811/F401 本来能在 PR 阶段就拦下来。
  #
  # ☠️ 用 pip 装而不是用第三方 action：本 workflow 的 action 全部按 commit SHA
  # 钉死（供应链硬化），引入一个新 action 就是多一个信任根；ruff 是单文件
  # 二进制、pip 装一秒装完，按精确版本钉住即可。**版本必须写死**——ruff 每个
  # 小版本都可能给已有规则加新检查，浮动版本会让 CI 在没人改代码的日子变红。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.2
      - name: ruff check
        # --output-format github 让告警直接标在 PR 的对应行上
        run: ruff check --output-format github .

  # requirements.txt 必须在**所有声明支持的 Python** 上解得出来。
  #
  # ☠️ 这个 job 是 2026-08-12 那次 numpy 事故的直接产物（第 4 节第 30 条）：
  # requirements.txt 当时写着 numpy>=2.5.1，而 numpy 2.5 起 requires_python>=3.12、
  # 没有 cp310 轮子——3.10/3.11 的用户走到"装依赖"那步直接失败。而 CI 全绿。
  # 原因是另外两个 job 装的都是自己写死的 "numpy>=1.24,<3" 之类，**从来没有
  # 任何一个 job 装过 requirements.txt 本身**。dependabot 每周都会提抬下限的
  # PR，没有这道守卫它随时会再来一次。
  #
  # --dry-run 只拉 metadata、不下载 wheel（整个 job 十几秒）。用一个 3.13 的
  # 解释器 + --python-version 逐个目标解析，不用开四份 setup-python。
  #
  # ☠️ 必须跑在 windows runner 上，不能用 ubuntu + `--platform win_amd64`。
  # 第一版就是那么写的，结果 3.13 假失败：
  #     ERROR: Could not find a version that satisfies the requirement
  #            nvidia-nccl-cu13==2.29.7; platform_system == "Linux" (from torch)
  # 因为 `--platform` **只改 wheel 标签匹配，不改环境标记求值**——
  # `platform_system` 仍按运行中的解释器算。在 ubuntu 上它是 "Linux"，于是
  # torch 那条 Linux 专属依赖被激活，再被 --only-binary + win_amd64 卡死。
  # 本项目只支持 Windows（pyaudiowpatch 连 linux 轮子都没有），在目标平台上
  # 解析本来就是更诚实的测法。
  deps-resolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: Resolve requirements.txt for every supported Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          failed=0
          for v in 3.10 3.11 3.12 3.13; do
            echo "::group::python $v"
            if pip install --dry-run --ignore-installed \
                 --python-version "$v" --only-binary=:all: \
                 --target "/tmp/resolve-$v" -r requirements.txt; then
              echo "OK   python $v"
            else
              echo "::error::requirements.txt 在 Python $v 上解析失败（README/CLAUDE.md 声称支持 3.10-3.13）"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  pipeline-helpers-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # translator_queue lazy-loads torch/faster-whisper on construct
          pip install "numpy>=1.24,<3" "requests>=2.28,<3" "soxr>=0.5,<2" -r requirements-dev.txt
      - name: Run pure pipeline unit tests
        # test_runtime_paths 必须在这里跑（不只 windows）：它盯的是运行时文件
        # 有没有掉出仓库根，纯 pathlib + 静态扫描，不需要 Qt/torch/WASAPI
        run: python -m pytest tests/test_pipeline_helpers.py tests/test_runtime_paths.py tests/test_migrate_legacy.py -q

  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install Windows unit-test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # CPU torch is enough: tests only need import-before-PyQt ordering
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "PyQt5>=5.15,<5.16" "numpy>=1.24,<3" "requests>=2.28,<3" "soxr>=0.5,<2" "PyAudioWPatch>=0.2.12" -r requirements-dev.txt
      - name: Run pytest suite (skip standalone GUI harness scripts)
        shell: bash
        run: |
          # pytest.ini already ignores test_hittest / resize_freedom / wordclick
          # Prefer non-interactive Qt
          export QT_QPA_PLATFORM=offscreen
          python -m pytest tests -q --tb=line
